[package]
name = "plane-llama"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
plane-llama-ui = { path = "../../crates/ui" }
plane-llama-core = { path = "../../crates/core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland", "persistence", "accesskit"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
