[package]
name = "fake-llama-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde_json = "1"

[dev-dependencies]
plane-llama-ui = { path = "../../crates/ui" }
egui_kittest = "0.36"
egui = "0.36"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
plane-llama-core = { path = "../../crates/core" }
tempfile = "3"
nix = { version = "0.30", features = ["signal", "process"] }

[[test]]
name = "processes"
path = "../../crates/core/tests/processes.rs"

[[test]]
name = "ui_benchmark"
path = "../../crates/ui/tests/ui_benchmark.rs"
