[package]
name = "plane-llama-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
[dependencies]
plane-llama-core = { path = "../core" }
egui = "0.36"
egui-phosphor = "0.14"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland", "persistence", "accesskit"] }
egui_extras = "0.36"
egui_plot = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
ksni = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-util = "0.7"
raw-window-handle = "0.6"
ron = "0.12"
log = "0.4"
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
[target.'cfg(target_os = "linux")'.dependencies]
# Desenfoque del fondo (ext-background-effect-v1) sobre la conexión Wayland de winit.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[[test]]
name = "components"
path = "tests/components.rs"

# Capturas de cada página con datos reales: `just screenshots` (requiere GPU).
[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
